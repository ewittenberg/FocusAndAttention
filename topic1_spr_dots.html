<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Paced Reading with Dot Interference</title>
<style>
  :root{
    --bg:#faf9f6; --panel:#ffffff; --text:#1a1a1a; --muted:#6a7179;
    --accent:#8a2f2f; --accent-bg:#f3e3e0; --border:#e3e6e4; --good:#2f6b45;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15181a; --panel:#1e2225; --text:#eef0f1; --muted:#a3aab0;
      --accent:#e08a8a; --accent-bg:#3a2323; --border:#33393d; --good:#7fd39a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15181a; --panel:#1e2225; --text:#eef0f1; --muted:#a3aab0;
    --accent:#e08a8a; --accent-bg:#3a2323; --border:#33393d; --good:#7fd39a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:Georgia, 'Source Serif 4', serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:32px 16px 64px;
  }
  .wrap{ width:100%; max-width:680px; }
  h1{ font-size:26px; font-weight:600; margin:0 0 4px; }
  .sub{ color:var(--muted); font-family:Arial, sans-serif; font-size:14px; margin-bottom:24px; }
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:28px; margin-bottom:20px;
  }
  .stage{
    min-height:220px; display:flex; align-items:center; justify-content:center;
    text-align:center; font-size:20px; line-height:1.5; flex-direction:column; gap:16px;
  }
  .word{ font-size:40px; font-weight:600; min-height:56px; }
  .dot{
    width:44px; height:44px; border-radius:50%; background:var(--accent);
  }
  .hint{ font-family:Arial, sans-serif; font-size:13px; color:var(--muted); }
  button{
    font-family:Arial, sans-serif; font-size:15px; font-weight:600;
    background:var(--accent); color:#fff; border:none; border-radius:8px;
    padding:12px 22px; cursor:pointer;
  }
  button.secondary{ background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled{ opacity:0.4; cursor:default; }
  .quiz-q{ margin-bottom:18px; font-family:Arial, sans-serif; }
  .quiz-q p{ font-weight:600; margin:0 0 8px; }
  label{ display:block; font-size:15px; margin:4px 0; cursor:pointer; }
  table{ width:100%; border-collapse:collapse; font-family:Arial, sans-serif; font-size:14px; }
  th,td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
  th{ color:var(--muted); font-weight:600; }
  .badge{ display:inline-block; padding:2px 8px; border-radius:999px; background:var(--accent-bg); color:var(--accent); font-size:12px; font-family:Arial, sans-serif; }
  .row{ display:flex; gap:12px; flex-wrap:wrap; }
  .stat{ flex:1; min-width:140px; background:var(--accent-bg); border-radius:10px; padding:14px; font-family:Arial, sans-serif; }
  .stat .n{ font-size:24px; font-weight:700; color:var(--accent); }
  .stat .l{ font-size:12px; color:var(--muted); margin-top:2px; }
  .good-text{ color:var(--good); font-weight:700; }
  .notice{ font-family:Arial, sans-serif; font-size:13px; color:var(--muted); background:var(--accent-bg); border-radius:8px; padding:10px 12px; margin-bottom:14px; }
  .bar-row{ display:flex; align-items:center; gap:8px; margin:6px 0; font-size:13px; font-family:Arial, sans-serif; }
  .bar-label{ width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ flex:1; background:var(--border); border-radius:4px; height:14px; position:relative; }
  .bar-fill{ background:var(--accent); height:100%; border-radius:4px; }
  .you-mark{ font-size:11px; font-weight:700; color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Self-Paced Reading with Dot Interference</h1>
  <div class="sub">Topic 1 — Attention, Focus, and Cognitive Control</div>
  <div id="app"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const app = document.getElementById('app');

// ============================================================= //
//  Reuses the same Firebase project as the Topic 2 mirror-       //
//  reading tool, under a separate "topic1" path so the two       //
//  don't mix. If you ever move this to a different Firebase      //
//  project, update FIREBASE_CONFIG below and add this path's     //
//  rules (see the comment further down) to that project's Rules. //
// ============================================================= //
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAAxtefwahsj9FYCo_VAb0bQ9wPNu1D1KY",
  authDomain: "fa-topic-2.firebaseapp.com",
  databaseURL: "https://fa-topic-2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "fa-topic-2",
  storageBucket: "fa-topic-2.firebasestorage.app",
  messagingSenderId: "938462396008",
  appId: "1:938462396008:web:3b4d74851dad19681a45dd",
};
const DEFAULT_ROOM = "default-room";

/* ADD THIS to your existing Realtime Database Rules (merge it in
   alongside the "rooms" key already there for Topic 2 — don't
   delete that one):

  "topic1": {
    "$room": {
      "results": {
        ".read": true,
        ".write": true,
        "$resultId": {
          ".validate": "newData.hasChildren(['nickname','avgBaselineRT','avgAfterDotRT','recoveryCost']) && newData.child('nickname').isString() && newData.child('nickname').val().length < 40 && newData.child('avgBaselineRT').isNumber() && newData.child('avgAfterDotRT').isNumber() && newData.child('recoveryCost').isNumber()"
        }
      }
    }
  }

  So the full rules object has BOTH "rooms" and "topic1" as
  top-level keys, alongside the existing ".read": false / ".write": false.
*/

function isConfigured(){
  return FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("PASTE_")
    && FIREBASE_CONFIG.databaseURL && !FIREBASE_CONFIG.databaseURL.startsWith("PASTE_");
}
const urlParams = new URLSearchParams(location.search);
const roomCode = (urlParams.get('room') || DEFAULT_ROOM).trim().slice(0, 60);
let db = null;

const passageA = { // baseline, no dots
  name: "Passage A (no interruptions)",
  words: "Honeybees communicate the location of food sources through a movement known as the waggle dance. A returning forager moves in a figure-eight pattern inside the dark hive, and the angle of the straight middle run relative to gravity indicates the direction of the flowers relative to the sun. The duration of that run signals distance, and nearby bees follow along, translating the dance into a flight path before they even leave the hive.".split(" "),
  dotPositions: [],
  questions: [
    { q: "The angle of the straight middle run is measured relative to gravity, but what does it ultimately communicate direction relative to?",
      options: ["The hive entrance","The sun","Magnetic north","The ground"], correct: 1 },
    { q: "Which single component of the dance specifically encodes distance, as distinct from direction?",
      options: ["The overall figure-eight shape","The duration of the straight middle run","The angle of the run relative to gravity","How many times nearby bees repeat the dance"], correct: 1 },
    { q: "According to the passage, what do nearby bees do with the dance's information?",
      options: ["Store it and share it with other bees later","Translate it into a flight path before they leave the hive","Independently verify it by flying to the location first","Use it only for distance, never for direction"], correct: 1 },
  ]
};

const passageB = { // interference, dots
  name: "Passage B (with dot interference)",
  words: "Johannes Gutenberg introduced movable metal type to Europe in the fourteen forties, allowing individual letters to be arranged, inked, and reused for different pages. Before this, most books were copied by hand or printed from carved wooden blocks, a slow and expensive process. Gutenberg's press combined a wine press mechanism with durable metal letters, and within decades printing workshops had spread across the continent, dramatically lowering the cost of books and accelerating the spread of new ideas.".split(" "),
  questions: [
    { q: "Before Gutenberg's innovation, books were produced by which two methods mentioned in the passage?",
      options: ["Hand-copying and carved wooden block printing","Carved wooden blocks and a wine press","Hand-copying and movable metal type","A wine press and hand-copying"], correct: 0 },
    { q: "What specifically let Gutenberg's press reuse individual letters for different pages?",
      options: ["The wine press mechanism alone","The durability and individual, rearrangeable form of the metal letters","The carved wooden blocks","The spread of workshops across the continent"], correct: 1 },
    { q: "According to the passage, what was the relationship between printing workshops spreading and the cost of books?",
      options: ["More workshops raised costs due to demand","Workshops spreading across the continent lowered the cost of books","Costs stayed the same regardless of workshops","Costs dropped only after wooden block printing was banned"], correct: 1 },
  ]
};
// Build dot positions for passage B: ~1 in 5 words, min gap 3, never first/last 2 words
(function(){
  const n = passageB.words.length;
  const positions = [];
  let lastDot = -10;
  for (let i = 3; i < n - 2; i++){
    if (i - lastDot >= 3 && Math.random() < 0.22){
      positions.push(i);
      lastDot = i;
    }
  }
  passageB.dotPositions = positions;
})();

if (isConfigured()){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
}

let state = {
  phase: 'name', // name -> intro -> reading_A -> quiz_A -> reading_B -> quiz_B -> summary
  nickname: '',
  data: { A: {rts:[], dot:[]}, B: {rts:[], dot:[]} },
  quizScores: { A: 0, B: 0 },
};

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  if (state.phase === 'name') return renderName();
  if (state.phase === 'intro') return renderIntro();
  if (state.phase === 'reading_A') return renderReading('A', passageA, 'reading_B_intro');
  if (state.phase === 'reading_B_intro') return renderBIntro();
  if (state.phase === 'reading_B') return renderReading('B', passageB, 'summary');
  if (state.phase === 'summary') return renderSummary();
}

function renderName(){
  app.innerHTML = `
    <div class="panel">
      <p>Before you start, pick a nickname so you can compare your results to the rest of the class (no real names needed).</p>
      <input type="text" id="nick" placeholder="e.g. BlueFalcon" maxlength="24" style="width:100%; padding:12px 14px; font-size:16px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:Arial, sans-serif;">
      <button id="nameStartBtn">Continue</button>
    </div>`;
  document.getElementById('nameStartBtn').onclick = () => {
    const v = document.getElementById('nick').value.trim();
    state.nickname = v || ('Reader' + Math.floor(Math.random()*900+100));
    state.phase = 'intro';
    render();
  };
}

function renderIntro(){
  app.innerHTML = `
    <div class="panel">
      <p>You'll read two short passages, one word at a time. Press <b>SPACE</b> to reveal the next word.</p>
      <p>Sometimes, instead of the next word, a red <span style="color:var(--accent);font-weight:700;">dot</span> will appear. When you see it, press <b>F</b> as fast as you can to clear it and keep reading.</p>
      <p>After each passage, answer three quick questions.</p>
      <button onclick="startPhase('reading_A')">Start Passage A</button>
    </div>`;
}

function renderBIntro(){
  app.innerHTML = `
    <div class="panel">
      <p>Nice work. Now Passage B — same task, but this time dots will occasionally interrupt your reading.</p>
      <button onclick="startPhase('reading_B')">Start Passage B</button>
    </div>`;
}

function startPhase(p){ state.phase = p; render(); if (p==='reading_A' || p==='reading_B') runReading(p==='reading_A'?'A':'B'); }

function renderReading(key, passage, nextPhase){
  app.innerHTML = `
    <div class="panel">
      <div class="hint">${passage.name} — press SPACE to continue, F when you see a dot</div>
      <div class="stage" id="stage"><div class="word" id="wordbox">Get ready…</div></div>
    </div>`;
}

function runReading(key){
  const passage = key === 'A' ? passageA : passageB;
  const dotSet = new Set(passage.dotPositions);
  let idx = 0;
  let wordShown = 0;
  let waitingForDot = false;
  let dotShown = 0;
  let dotTimeout = null;
  const wordbox = () => document.getElementById('wordbox');

  function showWord(){
    if (idx >= passage.words.length){
      finishReading(key);
      return;
    }
    if (dotSet.has(idx) && !waitingForDot){
      waitingForDot = true;
      dotShown = performance.now();
      if (wordbox()) wordbox().outerHTML = '<div class="dot" id="wordbox"></div>';
      dotTimeout = setTimeout(() => {
        if (!waitingForDot) return;
        state.data[key].dot.push({ idx, rt: 2000, hit: false });
        waitingForDot = false;
        dotSet.delete(idx);
        showWord();
      }, 2000);
      return;
    }
    waitingForDot = false;
    wordShown = performance.now();
    if (wordbox()) wordbox().outerHTML = `<div class="word" id="wordbox">${passage.words[idx]}</div>`;
  }

  function onKey(e){
    if (state.phase !== (key==='A'?'reading_A':'reading_B')) return;
    if (waitingForDot){
      if (e.key.toLowerCase() === 'f'){
        clearTimeout(dotTimeout);
        const dotRT = performance.now() - dotShown;
        state.data[key].dot.push({ idx, rt: Math.round(dotRT), hit: true });
        waitingForDot = false;
        dotSet.delete(idx); // don't re-trigger the same dot
        showWord(); // show the word that was behind the dot
      }
      return;
    }
    if (e.code === 'Space' || e.key === ' '){
      e.preventDefault();
      if (wordShown){
        const rt = performance.now() - wordShown;
        const afterDot = idx > 0 && dotSet.has(idx-1);
        state.data[key].rts.push({ idx, rt: Math.round(rt), afterDot });
      }
      idx++;
      showWord();
    }
  }
  document.addEventListener('keydown', onKey);
  // also allow tap/click to advance (mobile-friendly), and a button for dot
  const stage = document.getElementById('stage');
  stage.addEventListener('click', () => {
    if (waitingForDot){ onKey({key:'f'}); }
    else { onKey({code:'Space', key:' ', preventDefault:()=>{}}); }
  });
  setTimeout(showWord, 500);

  function finishReading(k){
    document.removeEventListener('keydown', onKey);
    renderQuiz(k);
  }
}

function renderQuiz(key){
  const passage = key === 'A' ? passageA : passageB;
  app.innerHTML = `
    <div class="panel">
      <h3 style="font-family:Arial,sans-serif;margin-top:0;">Quick check</h3>
      <form id="quizform">
        ${passage.questions.map((q,qi)=>`
          <div class="quiz-q">
            <p>${qi+1}. ${q.q}</p>
            ${q.options.map((o,oi)=>`
              <label><input type="radio" name="q${qi}" value="${oi}" required> ${o}</label>
            `).join('')}
          </div>`).join('')}
        <button type="submit">Submit answers</button>
      </form>
    </div>`;
  document.getElementById('quizform').addEventListener('submit', (e)=>{
    e.preventDefault();
    let score = 0;
    passage.questions.forEach((q,qi)=>{
      const val = document.querySelector(`input[name="q${qi}"]:checked`);
      if (val && parseInt(val.value) === q.correct) score++;
    });
    state.quizScores[key] = score;
    if (key === 'A'){ startPhase('reading_B_intro'); }
    else { startPhase('summary'); }
  });
}

function avg(arr){ return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }

function renderSummary(){
  const A = state.data.A, B = state.data.B;
  const avgA = avg(A.rts.map(r=>r.rt));
  const bBaseline = B.rts.filter(r=>!r.afterDot).map(r=>r.rt);
  const bAfterDot = B.rts.filter(r=>r.afterDot).map(r=>r.rt);
  const avgBBase = avg(bBaseline);
  const avgBAfter = avg(bAfterDot);
  const dotHits = B.dot.length;
  const dotAttempts = passageB.dotPositions.length;
  const avgDotRT = avg(B.dot.map(d=>d.rt));
  const recoveryCost = avgBAfter - avgBBase;

  app.innerHTML = `
    <div class="panel">
      <h3 style="font-family:Arial,sans-serif;margin-top:0;">Your results, ${escapeHtml(state.nickname)}</h3>
      <div class="row">
        <div class="stat"><div class="n">${Math.round(avgA)} ms</div><div class="l">Avg. word RT — Passage A (baseline)</div></div>
        <div class="stat"><div class="n">${Math.round(avgBBase)} ms</div><div class="l">Avg. word RT — Passage B, normal words</div></div>
        <div class="stat"><div class="n">${Math.round(avgBAfter)} ms</div><div class="l">Avg. word RT — word right after a dot</div></div>
        <div class="stat"><div class="n" style="${recoveryCost>0?'':'color:var(--good)'}">${recoveryCost>=0?'+':''}${Math.round(recoveryCost)} ms</div><div class="l">Recovery cost (after-dot minus baseline)</div></div>
        <div class="stat"><div class="n">${dotHits}/${dotAttempts}</div><div class="l">Dots cleared</div></div>
        <div class="stat"><div class="n">${Math.round(avgDotRT)||'—'} ms</div><div class="l">Avg. dot response time</div></div>
        <div class="stat"><div class="n">${state.quizScores.A}/3</div><div class="l">Comprehension — Passage A</div></div>
        <div class="stat"><div class="n">${state.quizScores.B}/3</div><div class="l">Comprehension — Passage B</div></div>
      </div>
      <p class="hint" style="margin-top:18px;">Compare your "recovery cost" number with classmates: does reading stay slow only on the interrupted word, or for a few words afterward?</p>
      <button class="secondary" onclick="location.reload()">Run again</button>
    </div>
    <div class="panel" id="classPanel">
      <h3 style="font-family:Arial,sans-serif;margin-top:0;">Live class comparison — Room ${escapeHtml(roomCode)}</h3>
      <div id="classAgg"></div>
      <div id="classBody" style="margin-top:14px;">Connecting…</div>
    </div>`;

  submitAndSubscribe({ avgBBase, avgBAfter, recoveryCost, dotHits, dotAttempts, quizA: state.quizScores.A, quizB: state.quizScores.B });
}

async function submitAndSubscribe(mine){
  const aggEl = document.getElementById('classAgg');
  const body = document.getElementById('classBody');
  if (!db){
    body.innerHTML = `<div class="notice">Live class comparison isn't connected on this copy of the page (Firebase isn't configured), but your own results above are still shown.</div>`;
    return;
  }
  try{
    await db.ref(`topic1/${roomCode}/results`).push({
      nickname: state.nickname,
      avgBaselineRT: Math.round(mine.avgBBase),
      avgAfterDotRT: Math.round(mine.avgBAfter),
      recoveryCost: Math.round(mine.recoveryCost),
      dotHits: mine.dotHits,
      dotAttempts: mine.dotAttempts,
      quizA: mine.quizA,
      quizB: mine.quizB,
      timestamp: firebase.database.ServerValue.TIMESTAMP,
    });
  }catch(e){ console.warn('Could not submit result', e); }

  const ref = db.ref(`topic1/${roomCode}/results`).limitToLast(100);
  ref.on('value', (snapshot) => {
    const docs = [];
    snapshot.forEach(child => { const v = child.val(); if (v) docs.push(v); });
    if (!docs.length){
      aggEl.innerHTML = '';
      body.innerHTML = `<div class="notice">Waiting for the first results to come in…</div>`;
      return;
    }
    const n = docs.length;
    const classAvgRecovery = avg(docs.map(d=>d.recoveryCost||0));
    const classAvgBaseline = avg(docs.map(d=>d.avgBaselineRT||0));
    const classAvgAfterDot = avg(docs.map(d=>d.avgAfterDotRT||0));
    const classAvgQuiz = avg(docs.map(d=>(d.quizA||0)+(d.quizB||0)));

    aggEl.innerHTML = `
      <div class="row">
        <div class="stat"><div class="n">${n}</div><div class="l">Students submitted</div></div>
        <div class="stat"><div class="n">${Math.round(classAvgBaseline)} ms</div><div class="l">Class avg. baseline word RT</div></div>
        <div class="stat"><div class="n">${Math.round(classAvgRecovery)} ms</div><div class="l">Class avg. recovery cost</div></div>
        <div class="stat"><div class="n">${classAvgQuiz.toFixed(1)}/6</div><div class="l">Class avg. comprehension score</div></div>
      </div>
      <p class="hint" style="margin-top:14px;">Your recovery cost: <b>${Math.round(mine.recoveryCost)} ms</b> — class average: <b>${Math.round(classAvgRecovery)} ms</b> (${mine.recoveryCost <= classAvgRecovery ? 'you recovered faster than average' : 'you recovered slower than average'}).</p>`;

    const maxMs = Math.max(...docs.map(d => Math.abs(d.recoveryCost||0)), 1);
    body.innerHTML = docs.slice().sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).map(d => {
      const w = Math.round((Math.abs(d.recoveryCost||0) / maxMs) * 100);
      const isYou = d.nickname === state.nickname && d.recoveryCost === Math.round(mine.recoveryCost);
      return `<div class="bar-row">
        <div class="bar-label">${escapeHtml(d.nickname || 'Reader')}${isYou ? ' <span class="you-mark">(you)</span>' : ''}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div>
        <div style="width:60px; text-align:right;">${d.recoveryCost >= 0 ? '+' : ''}${d.recoveryCost} ms</div>
      </div>`;
    }).join('');
  }, (err) => {
    body.innerHTML = `<div class="notice">Live results connection stopped (${err.code || err.message}). Reload to reconnect.</div>`;
  });
}

render();
</script>
</body>
</html>
