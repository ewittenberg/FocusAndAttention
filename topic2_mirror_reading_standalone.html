<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Online Mirror-Reading Task (Standalone, Live Class Results)</title>
<style>
  :root{
    --bg:#faf9f6; --panel:#ffffff; --text:#1a1a1a; --muted:#6a7179;
    --accent:#2f5d8a; --accent-bg:#e2ecf5; --border:#e3e6e4; --good:#2f6b45; --warn:#8a2f2f; --warn-bg:#f3e3e0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15181a; --panel:#1e2225; --text:#eef0f1; --muted:#a3aab0;
      --accent:#7fb0e0; --accent-bg:#20303f; --border:#33393d; --good:#7fd39a; --warn:#e08a8a; --warn-bg:#3a2323;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:24px 14px 64px;
  }
  .wrap{ width:100%; max-width:720px; }
  h1{ font-size:22px; font-weight:700; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:13px; margin-bottom:20px; }
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:24px; margin-bottom:18px;
  }
  input[type=text]{
    width:100%; padding:12px 14px; font-size:16px; border-radius:8px;
    border:1px solid var(--border); background:var(--bg); color:var(--text);
  }
  .mirror{
    font-size:30px; font-weight:600; text-align:center; padding:30px 8px;
    transform:scaleX(-1); user-select:none; word-break:break-word;
  }
  button{
    font-size:15px; font-weight:700; background:var(--accent); color:#fff;
    border:none; border-radius:8px; padding:12px 20px; cursor:pointer; margin-top:12px;
  }
  button.secondary{ background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button:disabled{ opacity:0.4; cursor:default; }
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th,td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
  th{ color:var(--muted); font-weight:600; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .stat{ flex:1; min-width:130px; background:var(--accent-bg); border-radius:10px; padding:14px; }
  .stat .n{ font-size:22px; font-weight:700; color:var(--accent); }
  .stat .l{ font-size:12px; color:var(--muted); margin-top:2px; }
  .bar-row{ display:flex; align-items:center; gap:8px; margin:6px 0; font-size:13px; }
  .bar-label{ width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ flex:1; background:var(--border); border-radius:4px; height:14px; position:relative; }
  .bar-fill{ background:var(--accent); height:100%; border-radius:4px; }
  .improve{ width:56px; text-align:right; font-weight:700; color:var(--good); font-size:12px; }
  .notice{ font-size:13px; color:var(--muted); background:var(--accent-bg); border-radius:8px; padding:10px 12px; margin-bottom:14px; }
  .setup{ background:var(--warn-bg); border:1px solid var(--warn); border-radius:12px; padding:20px; }
  .setup h2{ color:var(--warn); margin-top:0; font-size:18px; }
  .setup ol{ padding-left:20px; font-size:14px; line-height:1.6; }
  .setup code{ background:rgba(0,0,0,0.08); padding:2px 5px; border-radius:4px; font-size:13px; }
  .setup pre{ background:rgba(0,0,0,0.06); padding:12px; border-radius:8px; overflow-x:auto; font-size:12px; }
  .room-tag{ display:inline-block; background:var(--accent-bg); color:var(--accent); padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .copybtn{ font-size:12px; padding:6px 10px; margin-top:0; margin-left:8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Online Mirror-Reading Task</h1>
  <div class="sub">Standalone version — works on any device, no Claude account needed</div>
  <div id="app"></div>
</div>

<!-- ============================================================= -->
<!--  SETUP (read this before hosting the page)                    -->
<!--                                                                -->
<!--  This page needs a free Firebase Realtime Database to sync    -->
<!--  results live across every student's device. One-time setup: -->
<!--                                                                -->
<!--  1. Go to https://console.firebase.google.com, open your      -->
<!--     project, and find "Realtime Database" in the left menu    -->
<!--     (or the Project Overview grid of product cards).          -->
<!--  2. Click "Create Database". Choose a location, then choose   -->
<!--     "Start in locked mode" (we'll paste in the rules below).  -->
<!--  3. Once created, click the "Rules" tab and replace the       -->
<!--     contents with the JSON below, then click "Publish":       -->
<!--                                                                -->
<!--     {                                                         -->
<!--       "rules": {                                              -->
<!--         ".read": false,                                       -->
<!--         ".write": false,                                      -->
<!--         "rooms": {                                            -->
<!--           "$room": {                                          -->
<!--             "results": {                                      -->
<!--               ".read": true,                                  -->
<!--               ".write": true,                                 -->
<!--               "$resultId": {                                  -->
<!--                 ".validate": "newData.hasChildren(['nickname','round1Ms','lastRoundMs','roundsCorrect','totalRounds']) && newData.child('nickname').isString() && newData.child('nickname').val().length < 40 && newData.child('round1Ms').isNumber() && newData.child('lastRoundMs').isNumber()" -->
<!--               }                                                -->
<!--             }                                                 -->
<!--           }                                                   -->
<!--         }                                                     -->
<!--       }                                                       -->
<!--     }                                                         -->
<!--                                                                -->
<!--     This locks everything else down and only allows writes    -->
<!--     shaped like a valid result record under rooms/*/results.  -->
<!--                                                                -->
<!--  4. At the top of the Realtime Database page, copy the        -->
<!--     database URL shown there (looks like                      -->
<!--     https://YOUR-PROJECT-default-rtdb.REGION.firebasedatabase.app). -->
<!--  5. In Project settings (gear icon) > General > "Your apps",  -->
<!--     click the web icon (</>) to register a web app (if you    -->
<!--     haven't already), then copy the firebaseConfig object.    -->
<!--  6. Paste both the config AND the database URL into           -->
<!--     FIREBASE_CONFIG below, replacing the placeholders. Save   -->
<!--     the file and host it anywhere (GitHub Pages, your LMS,    -->
<!--     your own server, etc).                                    -->
<!--                                                                -->
<!--  To run a fresh class with no leftover data, just share a     -->
<!--  link with a new ?room= code, e.g. ?room=2026-09-25-section1  -->
<!--  Everyone using the same room code sees the same live results.-->
<!-- ============================================================= -->

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAAxtefwahsj9FYCo_VAb0bQ9wPNu1D1KY",
  authDomain: "fa-topic-2.firebaseapp.com",
  databaseURL: "https://fa-topic-2-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "fa-topic-2",
  storageBucket: "fa-topic-2.firebasestorage.app",
  messagingSenderId: "938462396008",
  appId: "1:938462396008:web:3b4d74851dad19681a45dd",
};
const DEFAULT_ROOM = "default-room";
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const app = document.getElementById('app');
const ROUNDS = [
  "Reading trains the brain.",
  "Practice can reshape how the brain processes words.",
  "Neuroplasticity lets the brain adapt quickly to strange unfamiliar tasks."
];

function isConfigured(){
  return FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("PASTE_")
    && FIREBASE_CONFIG.databaseURL && !FIREBASE_CONFIG.databaseURL.startsWith("PASTE_");
}

const params = new URLSearchParams(location.search);
const roomCode = (params.get('room') || DEFAULT_ROOM).trim().slice(0, 60);

let db = null;
if (isConfigured()){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
}

let state = {
  phase: 'name',
  nickname: '',
  round: 0,
  results: [],
  roundStart: 0,
};

function normalize(s){
  return s.toLowerCase().replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  if (state.phase === 'name') return renderName();
  if (state.phase === 'reading') return renderRound();
  if (state.phase === 'done') return renderDone();
}

function setupBanner(){
  if (isConfigured()) return '';
  return `
    <div class="setup">
      <h2>⚠️ One-time setup needed for live results</h2>
      <p>This copy of the page isn't connected to a Firebase project yet, so results won't sync across devices or save. The reading task below still works locally. Open this HTML file in a text editor and follow the numbered steps in the comment block near the top, then paste your Firebase config into <code>FIREBASE_CONFIG</code>.</p>
    </div>`;
}

function renderName(){
  app.innerHTML = `
    ${setupBanner()}
    <div class="notice">Room: <span class="room-tag">${escapeHtml(roomCode)}</span>
      <button class="secondary copybtn" id="copyLinkBtn">Copy shareable link</button>
    </div>
    <div class="panel">
      ${renderNameInner(false)}
    </div>`;
  document.getElementById('copyLinkBtn').onclick = () => {
    const url = new URL(location.href);
    url.searchParams.set('room', roomCode);
    navigator.clipboard?.writeText(url.toString());
    const b = document.getElementById('copyLinkBtn');
    b.textContent = 'Copied!';
    setTimeout(()=> b.textContent = 'Copy shareable link', 1500);
  };
  wireName(false);
}

function renderNameInner(){
  return `
    <p>Read each mirrored sentence below and type what it says, then press Enter. There are three short rounds — they get a little longer each time.</p>
    <label for="nick" style="font-size:13px;color:var(--muted);">Pick a nickname for the live class results (no real names needed)</label>
    <input type="text" id="nick" placeholder="e.g. BlueFalcon" maxlength="24">
    <button id="startBtn">Start</button>`;
}

function wireName(){
  document.getElementById('startBtn').onclick = () => {
    const v = document.getElementById('nick').value.trim();
    state.nickname = v || ('Reader' + Math.floor(Math.random()*900+100));
    state.phase = 'reading';
    state.round = 0;
    render();
  };
}

function renderRound(){
  const text = ROUNDS[state.round];
  app.innerHTML = `
    ${setupBanner()}
    <div class="panel">
      <div class="sub">Round ${state.round+1} of ${ROUNDS.length} — Room ${escapeHtml(roomCode)}</div>
      <div class="mirror">${escapeHtml(text)}</div>
      <input type="text" id="answer" placeholder="Type what you read, then press Enter" autocomplete="off">
    </div>`;
  const input = document.getElementById('answer');
  input.focus();
  state.roundStart = performance.now();
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){
      const ms = performance.now() - state.roundStart;
      const correct = normalize(input.value) === normalize(text);
      state.results.push({ ms: Math.round(ms), correct });
      state.round++;
      if (state.round >= ROUNDS.length){
        state.phase = 'done';
        submitResult();
      }
      render();
    }
  });
}

function renderDone(){
  const r = state.results;
  const improvePct = r[0].ms > 0 ? Math.round(((r[0].ms - r[r.length-1].ms) / r[0].ms) * 100) : 0;
  app.innerHTML = `
    ${setupBanner()}
    <div class="panel">
      <h3 style="margin-top:0;">Your results, ${escapeHtml(state.nickname)}</h3>
      <table>
        <tr><th>Round</th><th>Time</th><th>Correct?</th></tr>
        ${r.map((x,i)=>`<tr><td>${i+1}</td><td>${x.ms} ms</td><td>${x.correct ? '✔️' : '—'}</td></tr>`).join('')}
      </table>
      <div class="row" style="margin-top:14px;">
        <div class="stat"><div class="n">${r[0].ms} ms</div><div class="l">Round 1 time</div></div>
        <div class="stat"><div class="n">${r[r.length-1].ms} ms</div><div class="l">Round ${r.length} time</div></div>
        <div class="stat"><div class="n" style="color:var(--good)">${improvePct}%</div><div class="l">Faster by round ${r.length}</div></div>
      </div>
      <button class="secondary" onclick="location.reload()">Run again</button>
    </div>
    <div class="panel" id="liveResultsPanel">
      <h3 style="margin-top:0;">Live class results — Room ${escapeHtml(roomCode)}</h3>
      <div id="liveAgg"></div>
      <div id="liveResultsBody" style="margin-top:14px;">Connecting…</div>
    </div>`;
  subscribeLive();
}

async function submitResult(){
  if (!db) { render(); return; }
  try{
    await db.ref(`rooms/${roomCode}/results`).push({
      nickname: state.nickname,
      round1Ms: state.results[0].ms,
      lastRoundMs: state.results[state.results.length-1].ms,
      roundsCorrect: state.results.filter(x=>x.correct).length,
      totalRounds: state.results.length,
      timestamp: firebase.database.ServerValue.TIMESTAMP,
    });
  }catch(e){ console.warn('Could not submit result', e); }
  render();
}

let liveRef = null;
let liveHandler = null;
function subscribeLive(){
  const body = document.getElementById('liveResultsBody');
  const aggEl = document.getElementById('liveAgg');
  if (!db){
    body.innerHTML = `<div class="notice">Live results aren't connected (Firebase isn't configured on this copy of the page). Your own results above are still shown.</div>`;
    return;
  }
  if (liveRef && liveHandler) liveRef.off('value', liveHandler);
  liveRef = db.ref(`rooms/${roomCode}/results`).limitToLast(100);
  liveHandler = liveRef.on('value', (snapshot) => {
    const docs = [];
    snapshot.forEach(child => { const v = child.val(); if (v) docs.push(v); });
    docs.sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
    if (!docs.length){
      aggEl.innerHTML = '';
      body.innerHTML = `<div class="notice">Waiting for the first results to come in…</div>`;
      return;
    }
    const n = docs.length;
    const avg = arr => arr.reduce((a,b)=>a+b,0) / arr.length;
    const avgRound1 = avg(docs.map(d=>d.round1Ms||0));
    const avgLast = avg(docs.map(d=>d.lastRoundMs||0));
    const avgImprove = avg(docs.map(d => d.round1Ms > 0 ? ((d.round1Ms - d.lastRoundMs)/d.round1Ms)*100 : 0));

    aggEl.innerHTML = `
      <div class="row">
        <div class="stat"><div class="n">${n}</div><div class="l">Students submitted</div></div>
        <div class="stat"><div class="n">${Math.round(avgRound1)} ms</div><div class="l">Class avg. — Round 1</div></div>
        <div class="stat"><div class="n">${Math.round(avgLast)} ms</div><div class="l">Class avg. — final round</div></div>
        <div class="stat"><div class="n" style="color:var(--good)">${Math.round(avgImprove)}%</div><div class="l">Class avg. improvement</div></div>
      </div>`;

    const maxMs = Math.max(...docs.map(d => d.round1Ms || 1), 1);
    body.innerHTML = docs.map(d => {
      const pct = d.round1Ms > 0 ? Math.round(((d.round1Ms - d.lastRoundMs) / d.round1Ms) * 100) : 0;
      const w1 = Math.round((d.round1Ms / maxMs) * 100);
      return `<div class="bar-row">
        <div class="bar-label">${escapeHtml(d.nickname || 'Reader')}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${w1}%"></div></div>
        <div class="improve">${pct >= 0 ? '-' : '+'}${Math.abs(pct)}%</div>
      </div>`;
    }).join('');
  }, (err) => {
    body.innerHTML = `<div class="notice">Live results connection stopped (${err.code || err.message}). Reload to reconnect.</div>`;
  });
}

render();
</script>
</body>
</html>
